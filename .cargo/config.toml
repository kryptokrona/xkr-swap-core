[build]
target-dir = "target"

# Cross-compilation support for armv7
[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

# Windows defaults to smaller stack sizes which isn't enough
# For the MSVC tool-chain
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "link-arg=/STACK:8388608"]

# For the GNU/MinGW tool-chain
[target.'cfg(all(windows, target_env = "gnu"))']
linker = "x86_64-w64-mingw32-g++" # Use g++ driver so -lstdc++ gets pulled in automatically
rustflags = [
  # Statically link the whole MinGW CRT -- libgcc, libstdc++ AND libwinpthread --
  # so the .exe is self-contained. Without this, std's threading links
  # libwinpthread-1.dll dynamically and the binary insta-exits (STATUS_DLL_NOT_FOUND,
  # 0xC0000135) on a Windows box that lacks the MinGW runtime DLLs.
  "-C",
  "target-feature=+crt-static",
  "-C",
  "link-arg=-Wl,--stack,8388608",
  "-C",
  "link-arg=-ladvapi32",
  "-C",
  "link-arg=-lrpcrt4",
  "-C",
  "link-arg=-lole32",
  "-C",
  "link-arg=-lwinhttp",
  "-C",
  "link-arg=-lcrypt32",
  "-C",
  "link-arg=-static-libgcc",
  "-C",
  "link-arg=-static-libstdc++",
]

# Increase the default thread stack size to 40 MiB.
# Our callstack can get pretty big (especially in debug mode).
[env]
RUST_MIN_STACK = "41943040"
